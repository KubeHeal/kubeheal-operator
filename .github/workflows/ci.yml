name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_TAG_BASE: quay.io/takinosh/kubeheal-operator
  CONTAINER_TOOL: podman

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Helm chart
        run: helm lint helm-charts/self-healing-platform/

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build operator image
        run: make docker-build IMG=${{ env.IMAGE_TAG_BASE }}:${{ github.sha }} CONTAINER_TOOL=docker

  bundle-validate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install operator-sdk
        run: |
          curl -LO https://github.com/operator-framework/operator-sdk/releases/download/v1.42.3/operator-sdk_linux_amd64
          chmod +x operator-sdk_linux_amd64
          sudo mv operator-sdk_linux_amd64 /usr/local/bin/operator-sdk

      - name: Generate and validate bundle
        run: |
          make bundle IMG=${{ env.IMAGE_TAG_BASE }}:latest VERSION=0.1.0 CHANNELS=alpha DEFAULT_CHANNEL=alpha
          operator-sdk bundle validate ./bundle
