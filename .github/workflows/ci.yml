name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  IMAGE_TAG_BASE: quay.io/takinosh/kubeheal-operator
  CONTAINER_TOOL: docker

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Helm chart
        run: helm lint helm-charts/self-healing-platform/

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build operator image
        run: make docker-build IMG=${{ env.IMAGE_TAG_BASE }}:${{ github.sha }}

  bundle-validate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install operator-sdk
        run: |
          curl -LO https://github.com/operator-framework/operator-sdk/releases/download/v1.42.3/operator-sdk_linux_amd64
          chmod +x operator-sdk_linux_amd64
          sudo mv operator-sdk_linux_amd64 /usr/local/bin/operator-sdk

      - name: Generate and validate bundle
        run: |
          make bundle IMG=${{ env.IMAGE_TAG_BASE }}:latest VERSION=0.1.0 CHANNELS=alpha DEFAULT_CHANNEL=alpha
          operator-sdk bundle validate ./bundle

  release:
    runs-on: ubuntu-latest
    needs: [build, bundle-validate]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install operator-sdk
        run: |
          curl -LO https://github.com/operator-framework/operator-sdk/releases/download/v1.42.3/operator-sdk_linux_amd64
          chmod +x operator-sdk_linux_amd64
          sudo mv operator-sdk_linux_amd64 /usr/local/bin/operator-sdk

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Log in to Quay.io
        run: docker login -u ${{ secrets.QUAY_USERNAME }} -p ${{ secrets.QUAY_PASSWORD }} quay.io

      - name: Build and push operator image
        run: |
          make docker-build docker-push IMG=${{ env.IMAGE_TAG_BASE }}:${{ github.ref_name }}
          docker tag ${{ env.IMAGE_TAG_BASE }}:${{ github.ref_name }} ${{ env.IMAGE_TAG_BASE }}:latest
          docker push ${{ env.IMAGE_TAG_BASE }}:latest

      - name: Build and push bundle image
        run: |
          make bundle IMG=${{ env.IMAGE_TAG_BASE }}:${{ github.ref_name }} VERSION=${{ steps.version.outputs.VERSION }} CHANNELS=alpha DEFAULT_CHANNEL=alpha
          make bundle-build bundle-push BUNDLE_IMG=${{ env.IMAGE_TAG_BASE }}-bundle:${{ github.ref_name }}

      - name: Build and push catalog image
        run: make catalog-build catalog-push CATALOG_IMG=${{ env.IMAGE_TAG_BASE }}-catalog:${{ github.ref_name }}
