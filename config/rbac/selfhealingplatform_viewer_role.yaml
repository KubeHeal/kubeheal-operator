# This rule is not used by the project kubeheal-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to aiops.kubeheal.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubeheal-operator
    app.kubernetes.io/managed-by: kustomize
  name: selfhealingplatform-viewer-role
rules:
- apiGroups:
  - aiops.kubeheal.io
  resources:
  - selfhealingplatforms
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - aiops.kubeheal.io
  resources:
  - selfhealingplatforms/status
  verbs:
  - get
