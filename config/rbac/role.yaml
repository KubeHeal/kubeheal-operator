apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
##
## Base operator rules
##
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - "*"
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create

##
## Rules for aiops.kubeheal.io/v1alpha1, Kind: SelfHealingPlatform
##
- apiGroups:
  - aiops.kubeheal.io
  resources:
  - selfhealingplatforms
  - selfhealingplatforms/status
  - selfhealingplatforms/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

##
## Rules for resources created by the Helm chart
##

# Core resources
- apiGroups:
  - ""
  resources:
  - configmaps
  - endpoints
  - persistentvolumeclaims
  - pods
  - serviceaccounts
  - services
  verbs:
  - "*"

# Apps
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - "*"

# Batch (Jobs, CronJobs)
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - "*"

# RBAC
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  - clusterroles
  - clusterrolebindings
  verbs:
  - "*"

# OpenShift Routes
- apiGroups:
  - route.openshift.io
  resources:
  - routes
  - routes/custom-host
  verbs:
  - "*"

# KServe
- apiGroups:
  - serving.kserve.io
  resources:
  - inferenceservices
  - servingruntimes
  verbs:
  - "*"

# Tekton
- apiGroups:
  - tekton.dev
  resources:
  - pipelines
  - tasks
  - pipelineruns
  - taskruns
  verbs:
  - "*"

# NooBaa / ODF
- apiGroups:
  - noobaa.io
  resources:
  - bucketclasses
  verbs:
  - "*"
- apiGroups:
  - objectbucket.io
  resources:
  - objectbucketclaims
  verbs:
  - "*"

# External Secrets CRs
- apiGroups:
  - external-secrets.io
  resources:
  - externalsecrets
  - secretstores
  - clustersecretstores
  verbs:
  - "*"

# OLM (for operator subscriptions managed by the chart)
- apiGroups:
  - operators.coreos.com
  resources:
  - subscriptions
  - operatorgroups
  verbs:
  - "*"

# Monitoring
- apiGroups:
  - monitoring.coreos.com
  resources:
  - servicemonitors
  - prometheusrules
  verbs:
  - "*"

# RHOAI / Kubeflow (Jupyter workbench)
- apiGroups:
  - kubeflow.org
  resources:
  - notebooks
  verbs:
  - "*"

# RHOAI DataScienceCluster (enables KServe, workbenches, etc.)
- apiGroups:
  - datasciencecluster.opendatahub.io
  resources:
  - datascienceclusters
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

# OpenShift Build
- apiGroups:
  - build.openshift.io
  resources:
  - buildconfigs
  - builds
  verbs:
  - "*"

# OpenShift ImageStreams
- apiGroups:
  - image.openshift.io
  resources:
  - imagestreams
  - imagestreamtags
  verbs:
  - "*"

# Jupyter Notebook Validator
- apiGroups:
  - mlops.mlops.dev
  resources:
  - notebookvalidationjobs
  - notebookvalidationjobs/status
  - notebookvalidationjobs/finalizers
  verbs:
  - "*"

# NVIDIA GPU Operator (ClusterPolicy CRs)
- apiGroups:
  - nvidia.com
  resources:
  - clusterpolicies
  verbs:
  - "*"

# NFD Operator (NodeFeatureDiscovery CRs)
- apiGroups:
  - nfd.openshift.io
  resources:
  - nodefeaturediscoveries
  verbs:
  - "*"

# CRD listing (required by Helm to validate custom resources)
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch

# Console plugins (OpenShift console customisation)
- apiGroups:
  - console.openshift.io
  resources:
  - consoleplugins
  verbs:
  - "*"

# OpenShift Console operator (register plugins)
- apiGroups:
  - operator.openshift.io
  resources:
  - consoles
  verbs:
  - get
  - list
  - watch
  - patch
  - update

# OpenShift Console config (read cluster console config)
- apiGroups:
  - config.openshift.io
  resources:
  - consoles
  verbs:
  - get
  - list
  - watch
  - patch
  - update

# ExternalSecretsConfig (operator.openshift.io)
- apiGroups:
  - operator.openshift.io
  resources:
  - externalsecretsconfigs
  verbs:
  - "*"

# Networking (NetworkPolicy)
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - "*"

# cert-manager (Issuer, Certificate for JNV webhook certs)
- apiGroups:
  - cert-manager.io
  resources:
  - issuers
  - certificates
  verbs:
  - "*"

# +kubebuilder:scaffold:rules
