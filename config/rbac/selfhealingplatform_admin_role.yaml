# This rule is not used by the project kubeheal-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over aiops.kubeheal.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubeheal-operator
    app.kubernetes.io/managed-by: kustomize
  name: selfhealingplatform-admin-role
rules:
- apiGroups:
  - aiops.kubeheal.io
  resources:
  - selfhealingplatforms
  verbs:
  - '*'
- apiGroups:
  - aiops.kubeheal.io
  resources:
  - selfhealingplatforms/status
  verbs:
  - get
