# This rule is not used by the project kubeheal-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the aiops.kubeheal.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubeheal-operator
    app.kubernetes.io/managed-by: kustomize
  name: selfhealingplatform-editor-role
rules:
- apiGroups:
  - aiops.kubeheal.io
  resources:
  - selfhealingplatforms
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - aiops.kubeheal.io
  resources:
  - selfhealingplatforms/status
  verbs:
  - get
